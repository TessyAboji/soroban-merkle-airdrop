version: 2
updates:
  # ── Rust / Cargo ─────────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/contracts/airdrop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"

  # ── npm – SDK ─────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/sdk"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"

  # ── npm – CLI ─────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"

  # ── npm – Web ─────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
